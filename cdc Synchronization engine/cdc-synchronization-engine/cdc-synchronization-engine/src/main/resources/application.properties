spring.application.name=cdc-synchronization-engine
server.port=8080

# POSTGRESQL

spring.datasource.url=jdbc:postgresql://localhost:5432/cdc_sync_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# JACKSON

#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

#docker
spring.docker.compose.enabled=false
# KAFKA

spring.kafka.bootstrap-servers=localhost:9092

# Producer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer

spring.kafka.consumer.group-id=cdc-sync-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

# KAFKA TOPICS

cdc.kafka.topic.orders=orders-events
cdc.kafka.topic.customers=customers-events
cdc.kafka.topic.products=products-events
cdc.kafka.topic.inventory=inventory-events
cdc.kafka.topic.payments=payments-events

cdc.kafka.topic.dead-letter=cdc-dead-letter-topic

# REDIS

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000

# ELASTICSEARCH

spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# JWT

jwt.secret=ThisIsMyVerySecureJwtSecretKeyForCDCProject123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# SECURITY
#
#spring.security.user.name=admin
#spring.security.user.password=admin

# CACHE

spring.cache.type=redis

# ACTUATOR

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

management.health.redis.enabled=true
management.health.db.enabled=true

# MICROMETER

management.metrics.tags.application=cdc-sync-engine

# LOGGING

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger - %msg%n

# OPENAPI

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# RETRY

#spring.retry.enabled=true

cdc.retry.max-attempts=5
cdc.retry.initial-delay=1000
cdc.retry.multiplier=2
cdc.retry.max-delay=10000

# IDEMPOTENCY

cdc.idempotency.enabled=true

# CDC ENGINE

cdc.enabled=true
cdc.batch-size=500
cdc.processing.threads=8
cdc.processing.timeout=60
cdc.poll-interval=5000
cdc.max-events-per-poll=1000

# DEBEZIUM

cdc.debezium.connector=postgres-connector

cdc.debezium.hostname=localhost

cdc.debezium.port=5432

cdc.debezium.database=cdc_sync_db

cdc.debezium.username=postgres

cdc.debezium.password=admin
cdc.debezium.tables=public.orders,public.customers,public.products,public.inventory,public.payments
cdc.debezium.slot=cdc_slot

cdc.debezium.plugin=pgoutput
cdc.debezium.url=http://localhost:8083
cdc.debezium.server-name=cdc_postgres

# ELASTICSEARCH INDEXES

cdc.elasticsearch.orders-index=orders
cdc.elasticsearch.products-index=products
cdc.elasticsearch.customers-index=customers
cdc.elasticsearch.inventory-index=inventory

# AUDIT

cdc.audit.enabled=true

# CORRELATION ID

cdc.correlation-id.header=X-Correlation-ID

# PAGINATION

api.default-page-size=20
api.max-page-size=100

# FILE UPLOAD

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# SERVER

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# SHUTDOWN

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=30s