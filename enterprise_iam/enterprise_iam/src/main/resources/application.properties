spring.application.name=enterprise_iam
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_iam_db
spring.datasource.username=root
spring.datasource.password=admin123

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#mail

#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=kirubasaravanan03@gmail.com
#spring.mail.password=Vimala639

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#jwt

jwt.secret=ThisIsMySecureSecretKeyForJwtAuthentication123456789
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html