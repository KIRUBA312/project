spring.application.name=enterprise-order-system
server.port=8080

#Mysql
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_order_system
spring.datasource.username=root
spring.datasource.password=admin123

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=enterprise-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#resilience4j retry
resilience4j.retry.instances.paymentRetry.max-attempts=3
resilience4j.retry.instances.paymentRetry.wait-duration=2s
resilience4j.retry.instances.paymentRetry.enable-exponential-backoff=true
resilience4j.retry.instances.paymentRetry.exponential-backoff-multiplier=2

#resilience4j circuit breaker

resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.wait-duration-in-open-state=30s
