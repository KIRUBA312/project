spring.application.name=api-monetization
server.port=8080
server.servlet.context-path=/

#POSTGRESQL DATABASE

spring.datasource.url=jdbc:postgresql://localhost:5432/api_monetization
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

#REDIS

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.cache.type=redis

#KAFKA

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=api-monetization-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#JWT

jwt.secret=ThisIsMySuperSecureSecretKeyForJwtAuthentication2026DeveloperProject
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

#docker
spring.docker.compose.enabled=false
# SWAGGER / OPENAPI
############################################################

springdoc.api-docs.enabled=true

springdoc.swagger-ui.enabled=true

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha

springdoc.default-produces-media-type=application/json

springdoc.default-consumes-media-type=application/json


############################################################
# JACKSON
############################################################

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.jackson.default-property-inclusion=non_null

spring.jackson.time-zone=Asia/Kolkata


############################################################
# FILE UPLOAD
############################################################

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB


############################################################
# LOGGING
############################################################

logging.level.root=INFO

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.com.example.api_monetization=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


############################################################
# ACTUATOR
############################################################

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always


############################################################
# PAGINATION
############################################################

spring.data.web.pageable.default-page-size=10

spring.data.web.pageable.max-page-size=100

spring.data.web.sort.sort-parameter=sort


############################################################
# CACHE
############################################################

spring.cache.redis.time-to-live=600000


############################################################
# API RATE LIMIT DEFAULTS
############################################################

api.rate-limit.free=1000

api.rate-limit.basic=10000

api.rate-limit.premium=50000

api.rate-limit.enterprise=1000000


############################################################
# BILLING
############################################################

billing.invoice-day=1

billing.currency=INR


############################################################
# AUDIT
############################################################

audit.enabled=true


############################################################
# TIMEZONE
############################################################

app.timezone=Asia/Kolkata