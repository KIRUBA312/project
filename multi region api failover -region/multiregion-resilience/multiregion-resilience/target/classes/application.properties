# =========================================================
# APPLICATION
# =========================================================

spring.application.name=multiregion-resilience


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiregion_resilience}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms


# =========================================================
# SERVER CONFIGURATION
# =========================================================

server.port=${SERVER_PORT:8080}
server.shutdown=graceful


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=when_authorized


# =========================================================
# PROMETHEUS
# =========================================================

management.prometheus.metrics.export.enabled=true


# =========================================================
# APPLICATION METRICS
# =========================================================

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:development}


# =========================================================
# DISTRIBUTED TRACING
# =========================================================

management.tracing.sampling.probability=${TRACING_PROBABILITY:1.0}


# =========================================================
# RESILIENCE4J - CIRCUIT BREAKER
# =========================================================

resilience4j.circuitbreaker.instances.regionApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.regionApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.regionApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.regionApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.regionApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.regionApi.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.regionApi.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.regionApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.regionApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.regionApi.automatic-transition-from-open-to-half-open-enabled=true


# =========================================================
# RESILIENCE4J - RETRY
# =========================================================

resilience4j.retry.instances.regionApi.max-attempts=3
resilience4j.retry.instances.regionApi.wait-duration=500ms
resilience4j.retry.instances.regionApi.enable-exponential-backoff=true
resilience4j.retry.instances.regionApi.exponential-backoff-multiplier=2

resilience4j.retry.instances.regionApi.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.regionApi.retry-exceptions[1]=java.util.concurrent.TimeoutException

resilience4j.retry.instances.regionApi.ignore-exceptions[0]=java.lang.IllegalArgumentException


# =========================================================
# RESILIENCE4J - TIME LIMITER
# =========================================================

resilience4j.timelimiter.instances.regionApi.timeout-duration=2s
resilience4j.timelimiter.instances.regionApi.cancel-running-future=true


# =========================================================
# RESILIENCE4J - BULKHEAD
# =========================================================

resilience4j.bulkhead.instances.regionApi.max-concurrent-calls=20
resilience4j.bulkhead.instances.regionApi.max-wait-duration=500ms


# =========================================================
# RESILIENCE4J - RATE LIMITER
# =========================================================

resilience4j.ratelimiter.instances.regionApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.regionApi.limit-for-period=100
resilience4j.ratelimiter.instances.regionApi.timeout-duration=0


# =========================================================
# MULTI-REGION FAILOVER
# =========================================================

multiregion.failover.enabled=true
multiregion.failover.automatic=true
multiregion.failover.health-check-interval=10s
multiregion.failover.failure-threshold=3
multiregion.failover.recovery-threshold=2
multiregion.failover.timeout-ms=2000
multiregion.failover.default-region=ASIA
multiregion.failover.manual-failback-enabled=false
multiregion.failover.max-failover-attempts=3

# =========================================================
# AUTOMATIC FAILBACK
# =========================================================

multiregion.failover.automatic-failback-enabled=false
# =========================================================
# REGION CONFIGURATION
# =========================================================

region.selection-strategy=PRIORITY
region.select-only-health=true
region.priority-enabled=true


# =========================================================
# CACHE CONFIGURATION
# =========================================================

cache.enabled=true
cache.ttl-seconds=300
cache.synchronization-enabled=true
cache.synchronization-timeout-ms=2000


# =========================================================
# IDEMPOTENCY CONFIGURATION
# =========================================================

idempotency.enabled=true
idempotency.ttl-seconds=86400
idempotency.header-name=Idempotency-Key
idempotency.cleanup-interval-ms=3600000

# =========================================================
# API CONFIGURATION
# =========================================================

api.default-version=v1
api.max-page-size=100
api.default-page-size=20


# =========================================================
# CUSTOM TRACING CONFIGURATION
# =========================================================

tracing.enabled=true
tracing.request-id-header=X-Request-Id
tracing.trace-id-header=X-Trace-Id


# =========================================================
# AUDIT CONFIGURATION
# =========================================================

audit.enabled=true
audit.log-success=true
audit.log-failure=true


# =========================================================
# LOGGING CONFIGURATION
# =========================================================

logging.level.root=INFO
logging.level.com.example.multiregion_resilience=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO


# =========================================================
# SPRINGDOC / SWAGGER
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

springdoc.api-docs.path=/v3/api-docs

springdoc.packages-to-scan=com.example.multiregion_resilience.controller