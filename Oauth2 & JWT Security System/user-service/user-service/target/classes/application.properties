spring.application.name=user-service
server.port = 8082
#Mysql
spring.datasource.url=jdbc:mysql://localhost:3306/oauth_security_db
spring.datasource.username=root
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#JWT RESOURCE SERVER

jwt.secret=mysecretkeymysecretkeymysecretkeymysecretkey

spring.security.oauth2.resourceserver.jwt.secret-key=mysecretkeymysecretkeymysecretkeymysecretkey

#Swagger

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

#Actuator

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#LOGGING
logging.level.org.springframework.security=DEBUG
logging.level.com.example.userservice=INFO

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata
server.port=8082

