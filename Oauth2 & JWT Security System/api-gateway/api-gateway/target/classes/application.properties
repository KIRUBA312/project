spring.application.name=api-gateway
server.port=8080

# ======================================
# ACTUATOR
# ======================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ======================================
# GATEWAY ROUTES
# ======================================

# AUTH SERVER

spring.cloud.gateway.server.webflux.routes[0].id=auth-server
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
#spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# USER SERVICE

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
#spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# RESOURCE SERVICE

spring.cloud.gateway.server.webflux.routes[2].id=resource-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/resources/**
#spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ADMIN APIs

spring.cloud.gateway.server.webflux.routes[3].id=admin-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/admin/**

# ======================================
# REDIS
# ======================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

# ======================================
# RATE LIMITING
# ======================================

gateway.rate-limit.replenish-rate=10
gateway.rate-limit.burst-capacity=20

# ======================================
# JWT
# ======================================

jwt.secret=mysecretkeymysecretkeymysecretkeymysecretkey

# ======================================
# RESOURCE SERVER
# ======================================

#spring.security.oauth2.resourceserver.jwt.secret-key=mysecretkeymysecretkeymysecretkeymysecretkey

# ======================================
# CORS
# ======================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# ======================================
# HTTP TIMEOUT
# ======================================

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# ======================================
# SWAGGER
# ======================================

springdoc.swagger-ui.path=/swagger-ui.html

# ======================================
# LOGGING
# ======================================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG