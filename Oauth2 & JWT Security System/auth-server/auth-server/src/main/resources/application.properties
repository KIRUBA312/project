spring.application.name=auth-server
server.port=8081
#Mysql
spring.datasource.url=jdbc:mysql://localhost:3306/oauth_security_db
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernated.ddl-auto=update
spring.jpa.show-sql=true

#jwt
jwt.secret=MySecretKeyForJwtAuthentication123456789
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

#Redis

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.security.oauth2.authorizationserver.issuer=http://localhost:8081

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=*

security.login.max-attempts=5

tenant.cache.enabled=true

audit.enabled=true
server.forward-headers-strategy=framework
logging.level.org.springframework.security=DEBUG
